<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4A0"/>
      <stop offset="100%" stop-color="#00695C"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2F1"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#002D25" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Premium Rounded Icon Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Glow Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Training Desk Emblem: Graduation Mortarboard + Enrollment Desk Ledger -->
  <g filter="url(#shadow)">
    <!-- Mortarboard Diamond Top -->
    <path d="M32 14L52 24L32 34L12 24L32 14Z" fill="url(#capGrad)"/>
    
    <!-- Skull Cap Base -->
    <path d="M20 28.5V36C20 39.5 25.4 42 32 42C38.6 42 44 39.5 44 36V28.5L32 34.5L20 28.5Z" fill="#B2DFDB"/>

    <!-- Gold Tassel -->
    <path d="M47 25.5V36.5C47 37.8 48 38.8 49 38.8" stroke="#FFD54F" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="49" cy="40.5" r="2" fill="#FFA000"/>
    
    <!-- Enrollment Desk Ledger Bar -->
    <rect x="17" y="45" width="30" height="5.5" rx="2.75" fill="#FFFFFF"/>
    <!-- Micro Indicators for Sessions / Confirmed Status -->
    <circle cx="23" cy="47.75" r="1.3" fill="#00796B"/>
    <circle cx="28.5" cy="47.75" r="1.3" fill="#00796B"/>
    <circle cx="34" cy="47.75" r="1.3" fill="#00796B"/>
    <circle cx="41.5" cy="47.75" r="1.6" fill="#10B981"/>
  </g>
</svg>